[project]
name = "envyy"
version = "0.4.0"
description = "Fast, schema-driven environment configuration compiler and orchestrator."
readme = "README.md"
authors = [
    { name = "Trevor Wang", email = "stephen.trevor.wong@outlook.com" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0.2",
    "watchfiles>=0.21.0",
]

[project.scripts]
envyy = "envyy.cli:main"
envy = "envyy.cli:main"

[project.urls]
Homepage = "https://github.com/stetrevor/envyy"
Changelog = "https://github.com/stetrevor/envyy/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
